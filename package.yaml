# ACP Core Package Definition
# This file defines the Agent Context Protocol core package

name: acp-enhanced
version: 6.32.2
description: ACP Enhanced - Agent Context Protocol with structured context management layer (agent/ framework)
author: Suryo Sucipto
license: MIT
homepage: https://github.com/ssucipto/acp-enhanced
repository: https://github.com/ssucipto/acp-enhanced.git
fork_of:
  name: acp-core
  author: Patrick Michaelsen
  source: https://github.com/prmichaelsen/agent-context-protocol

# Release configuration
release:
  branch: mainline

# Package contents
contents:
  commands:
    # Package Management Commands
    - name: acp.package-create.md
      description: Create new ACP packages
      scripts:
        - acp.package-create.sh
        - acp.install.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-info.md
      description: Display package information
      scripts:
        - acp.package-info.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-install.md
      description: Install packages from repositories
      scripts:
        - acp.package-install.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-list.md
      description: List installed packages
      scripts:
        - acp.package-list.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-publish.md
      description: Publish packages to repositories
      scripts:
        - acp.package-publish.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-remove.md
      description: Remove installed packages
      scripts:
        - acp.package-remove.sh
        - acp.uninstall.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-search.md
      description: Search for packages on GitHub
      scripts:
        - acp.package-search.sh
        - acp.common.sh
    
    - name: acp.package-update.md
      description: Update installed packages
      scripts:
        - acp.package-update.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.package-validate.md
      description: Validate package structure
      scripts:
        - acp.package-validate.sh
        - acp.common.sh
        - acp.yaml-parser.sh
        - acp.yaml-validate.sh
    
    # Project Registry Commands (Experimental)
    - name: acp.project-list.md
      description: List registered projects
      experimental: true
      scripts:
        - acp.project-list.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    - name: acp.project-set.md
      description: Switch to a project
      experimental: true
      scripts:
        - acp.project-set.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.project-info.md
      description: Display project details
      experimental: true
      scripts:
        - acp.project-info.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.project-remove.md
      description: Remove a project from the registry
      experimental: true
      scripts:
        - acp.project-remove.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.project-update.md
      description: Update project metadata in the registry
      experimental: true
      scripts:
        - acp.project-update.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.projects-restore.md
      description: Restore project registry from backup
      experimental: true
      scripts:
        - acp.projects-restore.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.projects-sync.md
      description: Sync project registry across machines
      experimental: true
      scripts:
        - acp.projects-sync.sh
        - acp.common.sh
        - acp.yaml-parser.sh
    
    # Version Management Commands
    - name: acp.version-check.md
      description: Display current ACP version
      scripts:
        - acp.version-check.sh
    
    - name: acp.version-check-for-updates.md
      description: Check for ACP updates
      scripts:
        - acp.version-check-for-updates.sh
    
    - name: acp.version-update.md
      description: Update ACP to latest version
      scripts:
        - acp.version-update.sh
        - acp.common.sh
    
    # Entity Creation Commands (LLM-based, no scripts)
    - name: acp.command-create.md
      description: Create new commands
      scripts: []
    
    - name: acp.design-create.md
      description: Create design documents
      scripts: []
    
    - name: acp.design-spec.md
      description: Generate Application Interface & Data-Flow Design Specifications
      scripts: []
    
    - name: acp.stakeholder-report.md
      description: Generate weekly/monthly stakeholder progress summary with RAG health
      scripts: []
    
    - name: acp.review.md
      description: Standards enforcement for code quality, security, and consistency — OWASP, TypeScript, API convention rules
      scripts:
        - acp.review-scan.sh
        - acp.review-measure.sh
        - acp.entropy-scan.sh
        - acp.gitleaks.sh
        - acp.dupehound.sh
    
    - name: acp.integrity.md
      description: AI code integrity & trustworthiness — hidden Unicode, exfiltration, supply chain, CI injection detection
      scripts:
        - acp.unicode-scan.sh
        - acp.entropy-scan.sh
        - acp.manifest-hash.sh
        - acp.network-whitelist-validate.sh
        - acp.git-provenance.sh
        - acp.dependency-diff.sh
        - acp.pattern-scan.sh
        - acp.integrity-output.sh
        - acp.taint-scan.sh
        - acp.memory-scan.sh
    
    - name: acp.design-reference.md
      description: Generate design reference documents from existing designs
      scripts: []
    
    - name: acp.pattern-create.md
      description: Create pattern documents
      scripts: []
    
    - name: acp.task-create.md
      description: Create task documents
      scripts: []
    
    - name: acp.project-create.md
      description: Create new ACP projects
      scripts:
        - acp.install.sh

    - name: acp.spec.md
      description: Generate a specification document from a clarification, design, draft, requirements doc, or interactive input
      scripts: []
    
    # Workflow Commands (LLM-based, no scripts)
    - name: acp.init.md
      description: Initialize agent context
      scripts: []
    
    - name: acp.proceed.md
      description: Proceed with current task
      scripts: []
    
    - name: acp.resume.md
      description: Resume work on project
      scripts: []
    
    - name: acp.status.md
      description: Display project status
      scripts: []

    - name: acp.audit.md
      description: Deep-dive investigation of a subject with structured report output
      scripts: []

    - name: acp.plan.md
      description: Create project plans
      scripts: []
    
    - name: acp.report.md
      description: Generate session reports
      scripts: []
    
    - name: acp.sync.md
      description: Sync documentation with code
      scripts: []
    
    - name: acp.update.md
      description: Update progress tracking
      scripts: []
    
    - name: acp.validate.md
      description: Validate ACP structure
      scripts: []

    - name: acp.ci.md
      description: Local CI parity predictor (tiers static/fast/full)
      scripts:
        - acp.ci.sh
        - acp.ci-steps.sh
        - acp.common.sh

    - name: acp.pr.md
      description: Feature PR prep with gates delegated to /acp-ci
      scripts:
        - acp.pr.sh
        - acp.ci.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.commit.md
      description: End-of-session memory commit and route stamping
      scripts: []

    - name: acp.decide.md
      description: Create architecture decision records
      scripts: []

    - name: acp.dispatch.md
      description: Dispatch routed tasks to OpenRouter models
      scripts: []

    - name: acp.route.md
      description: Classify tasks and create routing files
      scripts: []

    - name: acp.task.md
      description: Create routing task files
      scripts: []

    - name: acp.feedback.md
      description: Capture and process user feedback
      scripts: []

    - name: acp.visualize.md
      description: Launch ACP Enhanced Visualizer dashboard
      scripts: []

    - name: acp.wiki-update.md
      description: Update wiki reference files by section
      scripts: []

    - name: acp.carryover-query.md
      description: Search audit carryovers registry
      scripts: []

    - name: acp.cost-report.md
      description: Weekly AI token spend and routing report
      scripts: []

    - name: acp.memory-sync.md
      description: Compact and sync memory registries to documents
      scripts: []

    - name: acp.pattern-sync.md
      description: Sync patterns registry to pattern documents
      scripts: []

    - name: acp.session-sync.md
      description: Sync sessions registry to session documents
      scripts: []

    - name: acp.rule-file-audit.md
      description: Fast pre-commit integrity scan alias for ACP rule files
      scripts:
        - acp.unicode-scan.sh

    - name: acp.install.md
      description: Install ACP commands and scripts into a project
      scripts:
        - acp.install.sh

    # Preferences Commands
    - name: acp.preferences-create.md
      description: Create a preference file at user/workspace/project level
      scripts:
        - acp.preferences.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.preferences-get.md
      description: Resolve and generate the effective preference set for a namespace
      scripts:
        - acp.preferences.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.preferences-set.md
      description: Set a preference value at a specified level with validation
      scripts:
        - acp.preferences.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.preferences-show.md
      description: Display effective preferences with source attribution
      scripts:
        - acp.preferences.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.preferences-validate.md
      description: Validate all preference files against configurables schemas
      scripts:
        - acp.preferences.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    - name: acp.handoff.md
      description: Generate cross-context task handoff reports (v2 dual mode — executor + cross-repo)
      scripts: []

    - name: acp.receive.md
      description: Load and verify incoming handoff before starting work (git drift, session gap, assignment checklist)
      scripts: []

    - name: acp.clarification-address.md
      description: Address clarification responses with research, tradeoffs, and recommendations (supports --deep and --shallow modes)
      scripts: []

    - name: acp.clarification-capture.md
      description: Capture and record clarification responses from stakeholders
      scripts: []

    - name: acp.clarification-create.md
      description: Create structured clarification documents for ambiguous requirements
      scripts: []

    - name: acp.index.md
      description: Manage the key file index
      scripts: []

    # Artifact Commands (LLM-based, no scripts)
    - name: acp.artifact-research.md
      description: Create long-lived research artifacts via systematic investigation
      scripts: []

    - name: acp.artifact-glossary.md
      description: Create and maintain project glossaries through auto-extraction
      scripts: []

    - name: acp.artifact-reference.md
      description: Create reference guides for passive information (command-first principle check)
      scripts: []

    # Sessions Command (Experimental)
    - name: acp.sessions.md
      description: Manage and view active agent sessions
      experimental: true
      scripts:
        - acp.sessions.sh
        - acp.common.sh
        - acp.yaml-parser.sh

    # Git Commands (LLM-based, no scripts)
    - name: git.commit.md
      description: Intelligent version-aware commits
      scripts: []
    
    - name: git.init.md
      description: Initialize git repository
      scripts: []
  
  scripts:
    # Package Management Scripts
    - name: acp.package-create.sh
      description: Package creation script
    
    - name: acp.package-info.sh
      description: Package info display script
    
    - name: acp.package-install.sh
      description: Package installation script
    
    - name: acp.package-list.sh
      description: Package listing script
    
    - name: acp.package-publish.sh
      description: Package publishing script
    
    - name: acp.package-remove.sh
      description: Package removal script
    
    - name: acp.package-search.sh
      description: Package search script
    
    - name: acp.package-update.sh
      description: Package update script
    
    - name: acp.package-validate.sh
      description: Package validation script
    
    # Project Registry Scripts (Experimental)
    - name: acp.project-list.sh
      description: Project listing script
      experimental: true
    
    - name: acp.project-set.sh
      description: Context switching script
      experimental: true

    - name: acp.project-info.sh
      description: Project info display script
      experimental: true

    - name: acp.project-remove.sh
      description: Project removal script
      experimental: true

    - name: acp.project-update.sh
      description: Project metadata update script
      experimental: true

    - name: acp.projects-restore.sh
      description: Project registry restore script
      experimental: true

    - name: acp.projects-sync.sh
      description: Project registry sync script
      experimental: true
    
    # Version Management Scripts
    - name: acp.version-check.sh
      description: Version check script
    
    - name: acp.version-check-for-updates.sh
      description: Update check script
    
    - name: acp.version-update.sh
      description: Version update script
    
    # Sessions Scripts (Experimental)
    - name: acp.sessions.sh
      description: Session tracking and management script
      experimental: true

    # Preferences Scripts
    - name: acp.preferences.sh
      description: Unified preferences utilities (get, set, validate, generate, presets)

    - name: acp.coderabbit.sh
      description: Optional CodeRabbit detection helpers — coderabbit_available/active (M78, ADR-21)
      type: utility

    - name: acp.findings-import.sh
      description: Import CodeRabbit findings JSON into audit-carryovers when coderabbit_active (M81, ADR-22)
      type: utility

    - name: acp.gitleaks.sh
      description: Optional gitleaks detection helpers for review-scan SC-01
      type: utility

    - name: acp.dupehound.sh
      description: Optional dupehound detection helpers and assisted install for CH-05
      type: utility

    # Installation Scripts
    - name: acp.install.sh
      description: ACP installation script
    
    - name: acp.uninstall.sh
      description: ACP uninstallation script

    # Internal / Utility Scripts
    - name: acp.meta-scan.sh
      description: Meta-scanning utility for spec/task/code cross-reference
      type: internal

    - name: acp.package-install-optimized.sh
      description: Optimized package installation with parallel fetch support
    
    # Utility Scripts (Shared)
    - name: acp.common.sh
      description: Shared utility functions
      type: utility
    
    - name: acp.yaml-parser.sh
      description: YAML parsing utilities
      type: utility
    
    - name: acp.yaml-validate.sh
      description: YAML schema validation
      type: utility

    - name: acp.atomic-write.sh
      description: Atomic file write via temp-file and rename (M70 GAP-041-08)
      type: utility

    - name: acp.branch-protection-setup.sh
      description: GitHub branch protection setup for mainline and develop (M70)
      type: utility

    - name: acp.cursor-commands-sync.sh
      description: Generate .cursor/commands wrappers from agent/commands (ADR-17)
      type: utility

    - name: acp.claude-commands-sync.sh
      description: Generate .claude/commands wrappers from agent/commands (ADR-18)
      type: utility

    - name: acp.post-milestone-sweep.sh
      description: Post-milestone deliverables audit sweep (M71)
      type: utility

    - name: acp.backfill-markers.sh
      description: Backfill ACP meta markers in command documents
      type: internal

    - name: acp.dependency-diff.sh
      description: Compare declared vs installed dependency versions
      type: internal

    - name: acp.driver-yaml.sh
      description: Driver YAML query helpers for delegated tooling
      type: utility

    - name: acp.entropy-scan.sh
      description: Entropy scan for integrity command
      type: internal

    - name: acp.git-provenance.sh
      description: Git provenance metadata for integrity scans
      type: internal

    - name: acp.integrity-output.sh
      description: Shared integrity scan output formatting
      type: utility

    - name: acp.manifest-hash.sh
      description: Generate and verify integrity manifest hashes
      type: utility

    - name: acp.memory-scan.sh
      description: Memory registry scan for integrity command
      type: internal

    - name: acp.network-whitelist-validate.sh
      description: Validate network whitelist configuration
      type: internal

    - name: acp.pattern-scan.sh
      description: Pattern registry scan for integrity command
      type: internal

    - name: acp.review-scan.sh
      description: Review scan utilities for /acp-review command
      type: internal

    - name: acp.review-measure.sh
      description: Review scan corpus precision/recall measurement
      type: internal

    - name: acp.ci.sh
      description: Local CI parity orchestrator for /acp-ci
      type: internal

    - name: acp.ci-steps.sh
      description: AE CI step bodies sourced by acp.ci.sh (P-PATH-1)
      type: internal

    - name: acp.pr.sh
      description: PR prep with gates delegated to acp.ci.sh
      type: internal

    - name: acp.upgrade-guard.sh
      description: Assert upstream-delta sentinels survived version-update (P-UG-1)
      type: internal

    - name: acp.review-rule-overrides.py
      description: Load review.rule_overrides preferences for scanner emitters
      type: internal

    - name: acp.taint-scan.sh
      description: Taint analysis scan for integrity command
      type: internal

    - name: acp.unicode-scan.sh
      description: Unicode normalization scan for integrity command
      type: internal

    - name: acp.recurring-complete.sh
      description: Advance recurring_tasks next_due after scheduled scans
      type: utility

  indices:
    - name: acp.core.yaml
      description: Key file index for core ACP command directives

# Compatibility requirements
requires:
  acp: ">=3.13.0"

# Tags for package discovery
tags:
  - acp-package
  - acp
  - core
  - commands
  - agent
  - ai
  - documentation
