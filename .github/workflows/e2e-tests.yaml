name: E2E Tests

on:
  push:
    branches:
      - mainline
      - develop
  pull_request:
    branches:
      - mainline
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.example.com"
          git config --global user.name "CI Test Runner"
          git config --global init.defaultBranch main

      - name: Generate manifest.yaml from template
        run: |
          if [ ! -f agent/manifest.yaml ]; then
            cp agent/manifest.template.yaml agent/manifest.yaml
          fi

      - name: Install Node.js dependencies
        run: |
          cd scripts && npm install --silent --ignore-scripts

      - name: Run E2E tests (parallel)
        run: bash run-e2e-tests.sh --parallel 4 --skip-network
        # Note on Windows: Test suites that are not Windows-portable should be
        # skipped within individual test scripts with a documented reason.
        # If a suite fails on Windows due to platform-specific bash differences
        # (e.g., /dev/fd, realpath, mktemp), mark it as SKIP in that suite and
        # file a follow-up issue. The matrix is fail-fast: false so all OSes report.
