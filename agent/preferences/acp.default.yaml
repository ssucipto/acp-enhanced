# ACP Default Preferences
# Project-level preference instance for the 'acp' namespace.
#
# These are the defaults applied when no workspace or user-level
# preference overrides exist. Values here correspond to configurables
# defined in: agent/configurables/acp.configurables.yaml
#
# Preference file precedence (highest → lowest):
#   1. agent/preferences/acp.default.yaml          ← this file (project)
#   2. .vscode/preferences/acp.yaml                (workspace)
#   3. ~/.acp/agent/preferences/acp.default.yaml   (user)
#   4. agent/configurables/acp.configurables.yaml  (built-in defaults)
#
# Path notation: three-part dot path (<scope>.<feature>.<name>)
#
# To override at workspace level, create:
#   .vscode/preferences/acp.yaml
# To override globally, create:
#   ~/.acp/agent/preferences/acp.default.yaml
#
# Version: 1.2.0
# Last Updated: 2026-07-23

acp:

  # ── Plan preferences ───────────────────────────────────────────────────────
  # Controls default behavior of /acp-plan

  plan:
    draft:
      create_mode: structured
      # Options: unstructured | structured | guided | contextual
    batch:
      auto_confirm: false
      # When true, batch planning skips the confirmation prompt

  # ── Task preferences ───────────────────────────────────────────────────────
  # Controls default behavior of /acp-task-create

  task:
    create:
      granularity: 3
      # Target task size in hours (1–8). Lower = more atomic tasks.
      auto_number: true
      # When true, task numbers assigned automatically (max existing + 1)

  # ── Validation preferences ─────────────────────────────────────────────────
  # Controls default behavior of /acp-validate

  validation:
    auto_fix:
      enabled: true
      # When true, safe unambiguous issues are corrected automatically
    strict_mode:
      enabled: false
      # When true, warnings are treated as errors (non-zero exit)

  # ── Output preferences ─────────────────────────────────────────────────────
  # Controls verbosity across all ACP commands

  output:
    verbosity:
      level: normal
      # Options: quiet | normal | verbose

  # ── Git preferences ────────────────────────────────────────────────────────
  # Controls automatic commit behavior

  git:
    auto_commit:
      enabled: false
      # When true, equivalent to always using /acp-proceed --commit in single-task mode

  # ── Integration preferences ────────────────────────────────────────────────
  # Optional external-tool integrations — all OFF by default (M78, ADR-21).
  # ACP is fully functional without CodeRabbit. See agent/wiki/coderabbit-integration.md

  integrations:
    coderabbit:
      enabled: false
      # When true AND a CodeRabbit config is detected, ACP enables CodeRabbit-aware hints.
      config_path: .coderabbit.yaml
      # Repo-relative file whose presence signals a CodeRabbit-configured repo.
    gitleaks:
      enabled: auto
      # auto enables gitleaks when the local binary is present; false disables it explicitly.
    dupehound:
      enabled: auto
      # auto enables CH-05 duplicate detection when dupehound is installed locally.
      min_tokens: 40
      # Reserved compatibility key for future dupehound filter tuning.
      install_prompt_version: ''
      # ACP version that last prompted for the optional dupehound install flow.

  # ── Review scanner preferences ───────────────────────────────────────────
  # Per-rule overrides for deterministic scanners (M84 / F-105-01).
  # Example:
  #   review:
  #     rule_overrides:
  #       NC-01:
  #         enabled: false
  #       CH-03:
  #         severity: LOW

  review:
    rule_overrides: {}
