# Audit Carryovers Schema
# Schema for validating ACP audit carryover entries (agent/memory/audit-carryovers.md)
# Version: 1.0.0

schema_version: 1.0.0
description: Schema for carryover entries in agent/memory/audit-carryovers.md

required_fields:
  - finding_id
  - severity
  - status
  - description

fields:
  finding_id:
    type: string
    required: true
    description: "Unique finding identifier (e.g., HIGH-065-004)"
  severity:
    type: string
    required: true
    enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
  status:
    type: string
    required: true
    enum:
      - pending
      - in_progress
      - fixed
      - deferred
      - wont_fix
  description:
    type: string
    required: true
    min_length: 10
  source_audit:
    type: string
    required: false
    description: "Audit that discovered this finding (e.g., audit-065)"
  affected_file:
    type: string
    required: false
    description: "Primary file affected by this finding"
  route:
    type: string
    required: false
    description: "Route that addresses this finding"
  fix_applied_date:
    type: string
    required: false
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  verified_in_audit:
    type: string
    required: false
    description: "Audit that verified the fix"
  notes:
    type: string
    required: false
