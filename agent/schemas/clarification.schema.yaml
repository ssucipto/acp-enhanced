# Clarification Entry Schema
# Schema for validating ACP clarification entries (agent/clarifications/)
# Version: 1.0.0

schema_version: 1.0.0
description: Schema for clarification files in agent/clarifications/

required_fields:
  - id
  - question
  - status

fields:
  id:
    type: string
    required: true
    pattern: "^CLAR-[0-9]+$"
  question:
    type: string
    required: true
    min_length: 10
  status:
    type: string
    required: true
    enum:
      - open
      - answered
      - deferred
      - superseded
  date:
    type: string
    required: false
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  asked_by:
    type: string
    required: false
  answered_by:
    type: string
    required: false
  answer:
    type: string
    required: false
  milestone:
    type: string
    required: false
    pattern: "^M[0-9]+$"
  route:
    type: string
    required: false
  tags:
    type: array
    required: false
    items:
      type: string
