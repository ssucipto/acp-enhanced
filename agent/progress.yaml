  M85:
    name: Preference & YAML Parser Performance (v6.30.1)
    priority: 4
    status: completed
    progress: 100
    started: 2026-07-30
    completed: '2026-08-02'
    estimated_weeks: 1
    tasks_completed: 8
    tasks_total: 8
    file: agent/milestones/milestone-85-preference-yaml-performance.md
    notes: 'PHASE 1 COMPLETE (297, 299, 298). Parser 1498 -> 320 forks per parse
      (79% fewer); yaml_parse 3384 -> 966ms on the benchmark fixture and 1369 ->
      360ms on the real 106-line preference file (3.8x). F-112-01 fixed; root cause
      was F2-06 — create_node was DEFINED TWICE and bash kept the non-escaping
      definition. preferences-validate 159s -> 28s, so A-110-07 is fixed at the
      root rather than masked. task-298 array cache REJECTED on evidence (it
      targeted ~19 of 635 forks, 3%, for a staleness hazard across 10 mutation
      sites); the same safe parameter-expansion technique was applied to the
      larger targets instead. AMENDED 2026-07-31 after re-measuring: the <150ms
      yaml_parse criterion is NOT achievable in pure bash — the remaining 320
      forks (wc -l per node, sed -i writes) need state that cannot cross the
      $( ) boundaries this parser is built on, the same constraint that killed
      the cache. 360ms is the architectural floor. PHASE 2 CONFIRMED STILL NEEDED:
      get_preference is 854ms post-Phase-1 (only 2 of 4 layers exist, so ~2 bash
      parses) and the only route under 100ms is to stop parsing YAML in bash on
      that path. BINDING: do NOT raise the 180s timeout (audit-110 showed it
      masks the defect). TASK-300 COMPLETE 2026-08-01: equivalence proven via
      a committed golden fixture (pre-M85 parser AST, all 74 tracked YAML
      files), not by re-running the pre-M85 parser every CI invocation — that
      parser did not finish dumping the whole repo in 5 minutes. DISCOVERY:
      add_child rewrites the whole growing AST_FILE with sed -i on every
      child append, in BOTH parsers, untouched by M85 field-access work —
      O(n^2), and the actual reason agent/progress.yaml (7880 nodes) takes
      ~100s to parse even with the current optimised parser. Out of scope
      for M85 (would need restructuring add_child itself, a rewrite not a
      tweak) but worth a future task if progress.yaml-sized files become a
      real bottleneck. 56 divergences found across both equivalence scripts,
      all verified attributable to F-112-01, including an unanticipated
      case: agent/index/*.yaml files using `description: |` YAML
      block-scalar syntax (unsupported by this parser, stored as literal
      "|") shifted the old cuts field boundaries the same way a `|`
      mid-string would. TASK-301 COMPLETE 2026-08-01: acp.pref-resolve.py,
      a line-for-line stdlib-only reimplementation of yaml_parse/yaml_query
      and get_preference precedence (no PyYAML). 28/28 tests pass: every
      real preference key agrees with bash exactly (value + exit code), a
      synthetic 4-layer fixture proves project > workspace > user >
      configurables precedence, the configurables .default suffix (F2-02)
      is verified against a sibling description field, flat-dot fallback
      reproduced including its all-whitespace-stripped quirk. Median 41-46ms
      vs 854ms bash baseline, well under the <100ms target.'
